set $backend_target http://backend:8000;
proxy_pass $backend_target;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# Przekazujemy poświadczenia bez logowania; XFF jest zawsze nadpisywany.
proxy_set_header Authorization $http_authorization;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Backend-Epoch $http_x_backend_epoch;
proxy_pass_header X-Backend-Epoch;
proxy_pass_header Retry-After;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 2s;
proxy_read_timeout 10s;
proxy_send_timeout 10s;
proxy_cache off;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
include /etc/nginx/security-headers.conf;
