worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Ponowne rozwiązywanie nazwy po odtworzeniu kontenera backendu.
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Bez URI, querystring, treści i nagłówków poświadczeń w logach.
    log_format safe '$time_iso8601 $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    # Nginx inicjalizuje również katalogi nieużywanych modułów przy starcie/-t.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;
    client_max_body_size 4k;
    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
    limit_req_status 429;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        error_page 403 = @forbidden;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        location @forbidden { include /etc/nginx/security-headers.conf; add_header Cache-Control 'no-store' always; default_type application/json; return 403 '{"error":{"code":"FORBIDDEN","message":"Operacja niedostępna przez proxy."}}'; }
        location @too_large { include /etc/nginx/security-headers.conf; add_header Cache-Control 'no-store' always; default_type application/json; return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"Za duże żądanie."}}'; }
        location @rate_limited { include /etc/nginx/security-headers.conf; add_header Cache-Control 'no-store' always; default_type application/json; add_header Retry-After 1 always; return 429 '{"error":{"code":"RATE_LIMITED","message":"Zbyt wiele żądań."}}'; }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /internal { deny all; }
        location ^~ /internal/ { deny all; }
        location = /api/v2/dh/nodes {
            if ($request_method != GET) { return 403; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location = /api/v2/dh/sessions {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        # Cudzysłowy chronią kwantyfikator regex przed parserem konfiguracji Nginx.
        location ~ "^/api/v2/dh/sessions/[0-9a-f]{32}$" {
            if ($request_method !~ ^(GET|DELETE)$) { return 403; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ "^/api/v2/dh/sessions/[0-9a-f]{32}/(start|cancel)$" {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ "^/api/v2/dh/sessions/[0-9a-f]{32}/(events|diagnostics|diagnostics/mallory)$" {
            if ($request_method != GET) { return 403; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ ^/api/v1/(rsa|dh)/demo/parameters$ {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=2 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ ^/api/v1/(rsa/demo/(encrypt|keygen)|dh/demo/exchange)$ {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=5 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location = /api/v1/rsa/demo/decrypt {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=5 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ ^/api/v1/rsa/demo/text/(encrypt|decrypt)$ {
            if ($request_method != POST) { return 403; }
            limit_req zone=api burst=2 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location /api/ { include /etc/nginx/security-headers.conf; add_header Cache-Control 'no-store' always; default_type application/json; return 404 '{"error":{"code":"NOT_FOUND","message":"Nie znaleziono zasobu."}}'; }
        location ~ ^/(docs|redoc|openapi.json)(/|$) { deny all; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
