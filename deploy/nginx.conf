worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Ponowne rozwiązywanie nazwy po odtworzeniu kontenera backendu.
    resolver 127.0.0.11 valid=5s ipv6=off;
    # Bez URI, querystring, treści i nagłówków poświadczeń w logach.
    log_format safe '$time_iso8601 $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 10s;
    send_timeout 10s;
    client_max_body_size 4k;
    limit_req_zone $binary_remote_addr zone=api:1m rate=20r/s;
    limit_req_status 429;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        include /etc/nginx/security-headers.conf;
        error_page 403 = @forbidden;
        error_page 413 = @too_large;
        error_page 429 = @rate_limited;
        location @forbidden { default_type application/json; return 403 '{"error":{"code":"FORBIDDEN","message":"Operacja niedostępna przez proxy."}}'; }
        location @too_large { default_type application/json; return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"Za duże żądanie."}}'; }
        location @rate_limited { include /etc/nginx/security-headers.conf; default_type application/json; add_header Retry-After 1 always; return 429 '{"error":{"code":"RATE_LIMITED","message":"Zbyt wiele żądań."}}'; }
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /internal { deny all; }
        location ^~ /internal/ { deny all; }
        location = /api/v1/dh/sessions/current { deny all; }
        location = /api/v1/dh/sessions {
            limit_except POST { deny all; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ ^/api/v1/dh/sessions/[a-zA-Z0-9_-]+/(start|cancel)$ {
            limit_except POST { deny all; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        # Mutacje protokołu są dostępne węzłom bezpośrednio w prywatnej sieci,
        # a nie przeglądarce. Odczyty edukacyjne pozostają zgodne z obecnym UI.
        location ~ ^/api/v1/dh/sessions/[a-zA-Z0-9_-]+(/(events|diagnostics|diagnostics/mallory|interceptions))?$ {
            limit_except GET { deny all; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location = /api/v1/dh/nodes {
            limit_except GET { deny all; }
            limit_req zone=api burst=20 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location ~ ^/api/v1/(rsa/demo/(encrypt|keygen)|dh/demo/exchange)$ {
            limit_except POST { deny all; }
            limit_req zone=api burst=5 nodelay;
            include /etc/nginx/proxy-backend.conf;
        }
        location /api/ { default_type application/json; return 404 '{"error":{"code":"NOT_FOUND","message":"Nie znaleziono zasobu."}}'; }
        location ~ ^/(docs|redoc|openapi.json)(/|$) { deny all; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
}
