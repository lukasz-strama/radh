name: Testy E2E UI

# Pełne testy interfejsu w Chrome i Firefox (360/390/768/1440 px) trwają kilka minut,
# więc uruchamiamy je tylko wtedy, gdy zmiana może wpłynąć na interfejs lub jego backend.
# Zawsze: po merge do main i ręcznie (Actions → Testy E2E UI → Run workflow).
on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "nodes/**"
      - "crypto-core/**"
      - "tests/test_ui_e2e/**"
      - "tests/helpers/**"
      - "tests/conftest.py"
      - "tests/requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/e2e.yml"
      # Same opisy i zrzuty ekranu nie zmieniają działania UI — nie odpalamy dla nich E2E.
      # Wykluczenia muszą być NA KOŃCU listy (późniejszy wzorzec wygrywa).
      - "!**/*.md"
      - "!frontend/docs/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nowy push do tej samej gałęzi przerywa poprzedni, niedokończony przebieg.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Testy E2E UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
            tests/requirements-e2e.txt

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Zbuduj bibliotekę CryptoCore
        run: |
          cmake -S crypto-core -B crypto-core/build
          cmake --build crypto-core/build

      - name: Zainstaluj zależności
        run: |
          python -m pip install -r backend/requirements.txt -r tests/requirements.txt -r tests/requirements-e2e.txt
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Wersje przeglądarek
        run: |
          google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version

      - name: Uruchom testy E2E (360/390/768/1440 px)
        env:
          PYTHONPATH: .
          RADH_E2E: "1"
          RADH_E2E_BROWSERS: ${{ matrix.browser }}
          RADH_E2E_ARTIFACTS: e2e-artifacts
        run: python -m pytest tests/test_ui_e2e --junitxml=e2e-results.xml

      - name: Zapisz zrzuty ekranu i wyniki
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-e2e-ui-${{ matrix.browser }}
          path: |
            e2e-results.xml
            e2e-artifacts/
          if-no-files-found: ignore