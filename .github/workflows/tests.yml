name: Testy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testy CryptoCore i API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt

      - name: Zbuduj bibliotekę CryptoCore
        run: |
          cmake -S crypto-core -B crypto-core/build
          cmake --build crypto-core/build

      - name: Uruchom testy biblioteki C (CTest)
        run: ctest --test-dir crypto-core/build --output-on-failure

      - name: Zainstaluj zależności testów
        run: python -m pip install -r tests/requirements.txt

      - name: Uruchom testy pytest
        run: python -m pytest --junitxml=pytest-results.xml

      - name: Podsumowanie wyników
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          import xml.etree.ElementTree as ET

          if not os.path.exists("pytest-results.xml"):
              print("## Wyniki testów\n\nBrak raportu: testy nie zostały uruchomione.")
          else:
              suite = ET.parse("pytest-results.xml").getroot()
              if suite.tag == "testsuites":
                  suite = suite[0]
              total = int(suite.get("tests", 0))
              failures = int(suite.get("failures", 0))
              errors = int(suite.get("errors", 0))
              skipped = int(suite.get("skipped", 0))
              passed = total - failures - errors - skipped
              print("## Wyniki testów pytest\n")
              print("| Zaliczone | Niezaliczone | Błędy | Pominięte/xfail |")
              print("| ---: | ---: | ---: | ---: |")
              print(f"| {passed} | {failures} | {errors} | {skipped} |")
          PY

      - name: Zapisz raport testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wyniki-testow
          path: pytest-results.xml
          if-no-files-found: ignore
