name: RADH Inspector

on:
  pull_request:
    paths:
      - "inspector/**"
      - ".github/workflows/inspector.yml"
  push:
    branches: [main]
    paths:
      - "inspector/**"
      - ".github/workflows/inspector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Zainstaluj zależności Linuksa
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libgl1-mesa-dev libx11-dev \
            libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - name: Zbuduj RADH Inspector
        run: |
          cmake -S inspector -B build/inspector -DCMAKE_BUILD_TYPE=Release
          cmake --build build/inspector --parallel 2
      - name: Uruchom testy bez okna
        run: ctest --test-dir build/inspector --output-on-failure
